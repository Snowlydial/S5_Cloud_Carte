services:
  web-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-web-app
    ports:
      - "80:80"
    networks:
      - appnet
    depends_on:
      - springboot
  springboot:
    build: .
    container_name: springboot-app-cloud
    ports:
      - "8080:8080"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge